global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "fraud-alert-service"
    static_configs:
      - targets: ["alert-service:8000"]
    metrics_path: /metrics

  - job_name: "kafka"
    static_configs:
      - targets: ["kafka:9092"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]

  - job_name: "flink-jobmanager"
    static_configs:
      - targets: ["flink-jobmanager:8081"]
    metrics_path: /metrics
