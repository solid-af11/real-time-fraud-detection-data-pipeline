version: "3.9"

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nfdstY="
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: "fraud-detection-secret"
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "10"
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "60"
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    POSTGRES_DSN: postgresql://fraud:fraud123@postgres/fraud_detection
    REDIS_URL: redis://redis:6379
    MLFLOW_TRACKING_URI: http://mlflow:5000
    FRAUD_RATE_ALERT_THRESHOLD: "0.05"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./generator:/opt/airflow/generator
    - ./flink_jobs:/opt/airflow/flink_jobs
    - ./spark_jobs:/opt/airflow/spark_jobs
    - ./api:/opt/airflow/api
    - ./config:/opt/airflow/config
    - airflow-logs:/opt/airflow/logs
    - airflow-plugins:/opt/airflow/plugins
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - fraud-net

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - fraud-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    networks:
      - fraud-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fraud-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - fraud-net

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - fraud-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud123
      POSTGRES_DB: fraud_detection
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/init_db.sql:/docker-entrypoint-initdb.d/01_fraud.sql
      - ./config/init_airflow_db.sql:/docker-entrypoint-initdb.d/02_airflow.sql
    networks:
      - fraud-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: mlflow
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri postgresql://fraud:fraud123@postgres/mlflow
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fraud-net

  transaction-generator:
    build:
      context: ./generator
      dockerfile: Dockerfile
    container_name: transaction-generator
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: raw-transactions
      TRANSACTIONS_PER_SECOND: 50
      FRAUD_RATE: 0.02
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - fraud-net
    restart: "no"

  feature-engineering:
    build:
      context: ./flink_jobs
      dockerfile: Dockerfile
    container_name: feature-engineering
    command: ["python", "-u", "feature_engineering.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_DSN: postgresql://fraud:fraud123@postgres/fraud_detection
      REDIS_URL: redis://redis:6379
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fraud-net
    restart: "no"

  fraud-inference:
    build:
      context: ./flink_jobs
      dockerfile: Dockerfile
    container_name: fraud-inference
    command: ["python", "-u", "fraud_inference.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_DSN: postgresql://fraud:fraud123@postgres/fraud_detection
      REDIS_URL: redis://redis:6379
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fraud-net
    restart: "no"

  alert-service:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: alert-service
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FRAUD_ALERTS_TOPIC: fraud-alerts
      POSTGRES_DSN: postgresql://fraud:fraud123@postgres/fraud_detection
      REDIS_URL: redis://redis:6379
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fraud-net
    restart: on-failure

  prometheus:
    image: prom/prometheus:v2.49.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - fraud-net

  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: fraud123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - fraud-net

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@fraud.local &&
        echo "Airflow initialised successfully."
    environment:
      <<: *airflow-common-env

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8082:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: >
      airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  mlflow-artifacts:
  grafana-data:
  airflow-logs:
  airflow-plugins:

networks:
  fraud-net:
    driver: bridge
